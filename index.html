<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Image Evaluation Survey</title>
<script src="data.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e3e6ea;
    --text: #1c2330; --sub: #6b7484; --accent: #3b5bdb; --accent-soft: #e7ecfd;
    --good: #2f9e44;
  }
  body { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.55; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  .hidden { display: none !important; }

  /* ---------- language toggle ---------- */
  .lang-toggle { position: fixed; top: 12px; right: 14px; z-index: 30;
                 display: flex; background: var(--card); border: 1px solid var(--line);
                 border-radius: 999px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .lang-toggle button { border: none; background: transparent; cursor: pointer;
                        font-size: 12.5px; font-weight: 600; padding: 6px 12px; color: var(--sub); }
  .lang-toggle button.on { background: var(--accent); color: #fff; }

  /* ---------- gate ---------- */
  .gate-card { max-width: 640px; margin: 40px auto; background: var(--card);
               border: 1px solid var(--line); border-radius: 12px; padding: 32px; }
  .gate-card h1 { font-size: 22px; margin-bottom: 6px; }
  .gate-card .sub { color: var(--sub); font-size: 14px; margin-bottom: 22px; }
  .intro { font-size: 14px; margin-bottom: 20px; }
  .intro p { margin-bottom: 7px; }
  .intro .thanks { font-weight: 700; color: var(--accent); margin-top: 10px; }
  .guide { background: #f2f5ff; border: 1px solid #dbe3fb; border-radius: 10px;
           padding: 16px 18px; font-size: 14px; margin-bottom: 22px; }
  .guide b { color: var(--accent); }
  .guide ul { margin: 8px 0 0 18px; }
  .guide li { margin-bottom: 6px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input[type=text] { width: 100%; padding: 11px 12px; font-size: 15px;
                     border: 1px solid var(--line); border-radius: 8px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .err { color: #d6336c; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .btn { display: inline-block; border: none; cursor: pointer; border-radius: 9px;
         font-size: 15px; font-weight: 600; padding: 12px 22px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: #b8c2e8; cursor: default; }
  .btn-ghost { background: var(--card); border: 1px solid var(--line); color: var(--text); }
  .btn-block { width: 100%; margin-top: 20px; }

  /* ---------- header / progress ---------- */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--bg);
            padding: 10px 0 12px; }
  .topline { display: flex; justify-content: space-between; align-items: baseline;
             font-size: 13px; color: var(--sub); margin-bottom: 6px; padding-right: 130px; }
  .topline b { color: var(--text); font-size: 15px; }
  .bar { height: 6px; background: #e6e9ee; border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }

  .mini-btn { border: 1px solid var(--line); background: var(--card); color: var(--accent);
              font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px;
              cursor: pointer; margin-left: 10px; }
  .mini-btn:hover { border-color: var(--accent); }
  .scale-hint { font-size: 13px; color: var(--sub); margin: -8px 0 12px; }

  /* ---------- help overlay ---------- */
  #help-overlay { position: fixed; inset: 0; background: rgba(10,12,18,.55); z-index: 40;
                  display: flex; align-items: center; justify-content: center; padding: 18px; }
  .help-box { max-width: 660px; width: 100%; max-height: 85vh; overflow-y: auto;
              background: var(--card); border-radius: 12px; padding: 24px; }
  .help-box .guide { margin-bottom: 16px; }

  /* ---------- prompt ---------- */
  .prompt-box { background: var(--card); border: 1px solid var(--line);
                border-radius: 12px; padding: 16px 20px; margin: 14px 0 18px; }
  .prompt-box .cap { font-size: 12px; font-weight: 700; color: var(--accent);
                     letter-spacing: .4px; margin-bottom: 4px; }
  .prompt-box .txt { font-size: 17px; font-weight: 600; }
  .prompt-box .txt-ko { font-size: 14px; color: var(--sub); margin-top: 6px; }

  /* ---------- image cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; }
  .card.complete { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
  .card .imgno { font-size: 12px; font-weight: 700; color: var(--sub);
                 padding: 8px 12px 4px; }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #eceef1;
              cursor: zoom-in; display: block; }
  .rate { padding: 10px 12px 12px; }
  .rate .rlabel { font-size: 12px; font-weight: 600; color: var(--sub); margin: 6px 0 4px; }
  .scale { display: flex; gap: 5px; }
  .scale button { flex: 1; padding: 8px 0; font-size: 14px; font-weight: 600;
                  border: 1px solid var(--line); background: #fff; border-radius: 7px;
                  cursor: pointer; color: var(--text); }
  .scale button:hover { border-color: var(--accent); }
  .scale button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- nav ---------- */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .nav .hint { font-size: 13px; color: var(--sub); }

  /* ---------- lightbox ---------- */
  #lightbox { position: fixed; inset: 0; background: rgba(10,12,18,.88); z-index: 50;
              display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox img { max-width: 94vw; max-height: 94vh; }

  /* ---------- done ---------- */
  .done-card { max-width: 560px; margin: 60px auto; background: var(--card);
               border: 1px solid var(--line); border-radius: 12px; padding: 36px; text-align: center; }
  .done-card h2 { margin-bottom: 10px; }
  .done-card p { color: var(--sub); font-size: 14px; margin-bottom: 8px; }
  .spin { display: inline-block; width: 22px; height: 22px; border: 3px solid #d6dcf5;
          border-top-color: var(--accent); border-radius: 50%; animation: sp 1s linear infinite;
          margin-bottom: 12px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="lang-toggle">
  <button id="lang-en">English</button>
  <button id="lang-ko">한국어</button>
</div>
<div class="wrap">

  <!-- ========== entry gate ========== -->
  <div id="gate" class="gate-card">
    <h1 id="g-title"></h1>
    <div class="sub" id="g-sub"></div>
    <div class="intro" id="g-intro"></div>
    <div class="guide" id="g-guide"></div>
    <label id="g-name-label"></label>
    <input type="text" id="inp-name" autocomplete="off">
    <label id="g-phone-label"></label>
    <input type="text" id="inp-phone" placeholder="010-1234-5678" autocomplete="off">
    <div class="err" id="gate-err"></div>
    <button class="btn btn-primary btn-block" id="btn-start"></button>
  </div>

  <!-- ========== survey ========== -->
  <div id="survey" class="hidden">
    <div class="topbar">
      <div class="topline">
        <span><b id="prog-num"></b> / <span id="prog-total"></span> <span id="prog-word"></span></span>
        <span><span id="who"></span><button class="mini-btn" id="btn-help"></button></span>
      </div>
      <div class="bar"><div id="prog-fill"></div></div>
    </div>
    <div class="prompt-box">
      <div class="cap">TEXT PROMPT</div>
      <div class="txt" id="prompt-text"></div>
      <div class="txt-ko hidden" id="prompt-ko"></div>
    </div>
    <div class="scale-hint" id="scale-hint"></div>
    <div class="grid" id="grid"></div>
    <div class="nav">
      <button class="btn btn-ghost" id="btn-prev"></button>
      <span class="hint" id="nav-hint"></span>
      <button class="btn btn-primary" id="btn-next"></button>
    </div>
  </div>

  <!-- ========== done / submit ========== -->
  <div id="done" class="done-card hidden"></div>

</div>
<div id="lightbox" class="hidden"><img id="lightbox-img" alt=""></div>
<div id="help-overlay" class="hidden">
  <div class="help-box">
    <div class="guide" id="help-guide"></div>
    <button class="btn btn-primary btn-block" id="btn-help-close" style="margin-top:0"></button>
  </div>
</div>

<script>
"use strict";
/* ================= config ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzTa26SQ75dTBEKqDPk_741UJWLbRWicaG59m4oJAwCaLBfEdQJ2mor_JzfZ2OqFBCP/exec";

// ?test=5 -> short 5-question version (separate saved progress, sessionId tagged "_test5")
const TEST_N = Math.max(0, parseInt(new URLSearchParams(location.search).get("test")) || 0);
const ITEMS = TEST_N ? SURVEY_ITEMS.slice(0, TEST_N) : SURVEY_ITEMS;
const N_ITEMS = ITEMS.length;
const STORE_PREFIX = "festdpo_v1_" + (TEST_N ? "test" + TEST_N + "_" : "");

/* ================= i18n ================= */
const T = {

    guide: `There are <b>${N_ITEMS} questions</b> in total${TEST_N ? "" : ", taking about <b>20 minutes</b>"}.

    scaleHint: "Rate every image on both criteria — 1 = very poor, 5 = excellent (higher is better).",
    help: "ℹ️ Instructions",
    helpClose: "Close",
    submitting: "Submitting...",
    wait: "Please wait a moment.",
    doneTitle: "Submitted! 🎉",
    doneThanks: (n) => `${n}, thank you so much for participating.`,
    doneClose: "You can close this window now.",
    backupTitle: "Backup of your responses needed",
    failNet: "Submission failed due to a network error.",
    failNoServer: "The submission server is not configured yet.",
    backupInstr: "Please download the file below and <b>send it to the researcher (Kanghoon).</b>",
    download: "Download response file",
    retry: "Try submitting again",
  },
  ko: {
    title: "이미지 평가 설문",
    sub: "AI 생성 이미지 품질 평가 연구",
    intro: `<p>🙏 설문에 참여해 주셔서 감사합니다.</p>
      <p>🏫 본 설문은 <b>KAIST SILAB(Systems Intelligence Lab)</b>에서 AI 생성 이미지 평가 연구의

      <p>📷 본 연구의 목적은 AI가 생성한 이미지의 심미적 품질과 다양성을 평가하는 것입니다.</p>

      <ul>

            (1 = 매우 나쁨, 5 = 매우 좋음). 네 이미지를 서로 비교하면서 점수를 매겨 주세요.</li>

        <li>진행 상황은 <b>이 브라우저에 자동 저장</b>됩니다. 창을 닫아도 같은 기기에서
            같은 이름으로 다시 접속하면 이어서 진행됩니다.</li>
        <li>모든 문항 완료 후 마지막에 <b>제출 버튼</b>을 꼭 눌러 주세요.</li>
      </ul>
      <div style="margin-top:12px; padding-top:10px; border-top:1px dashed #c3cef5;">
        🎁 <b>추첨 이벤트:</b> 참여자 중 추첨을 통해 <b>6분께 스타벅스 기프티콘 1만원권</b>을 드립니다!
        30명 중 6명, <b>약 20% 확률</b>이에요. 참여를 원하시면 아래에 전화번호를 입력해 주세요.
      </div>`,
    nameLabel: "이름 (본인 확인용)",
    namePh: "예: 홍길동",
    phoneLabel: "전화번호 (선택) — 참여자 추첨용입니다. 추첨을 원하지 않으시면 비워 두셔도 돼요 😊",
    start: "시작하기",
    errName: "이름을 입력해 주세요.",
    progWord: "문항",
    who: (n) => n + " 님",
    imageN: (i) => `이미지 ${i}`,
    align: "텍스트 일치도",
    aes: "심미성 (선호도)",
    prev: "← 이전",
    next: "다음 →",
    submit: "제출하기 ✓",
    hint: "모든 이미지에 두 항목씩 점수를 매겨 주세요",
    scaleHint: "각 이미지를 두 항목 모두 평가해 주세요 — 1점 = 매우 나쁨, 5점 = 매우 좋음 (높을수록 좋은 점수예요).",
    help: "ℹ️ 안내 보기",
    helpClose: "닫기",
    submitting: "제출 중...",
    wait: "잠시만 기다려 주세요.",
    doneTitle: "제출 완료! 🎉",
    doneThanks: (n) => `${n} 님, 참여해 주셔서 정말 감사합니다.`,
    doneClose: "이 창은 닫으셔도 됩니다.",
    backupTitle: "응답 백업이 필요합니다",
    failNet: "네트워크 오류로 제출에 실패했습니다.",
    failNoServer: "제출 서버가 아직 설정되지 않았습니다.",
    backupInstr: "아래 버튼으로 응답 파일을 저장한 뒤 <b>연구자(강훈)에게 파일을 보내 주세요.</b>",
    download: "응답 파일 다운로드",
    retry: "다시 제출 시도",
  },
};
let lang = localStorage.getItem("festdpo_lang") || "en";
const t = (k, ...a) => (typeof T[lang][k] === "function" ? T[lang][k](...a) : T[lang][k]);

const $ = (id) => document.getElementById(id);
let doneState = null;   // {kind:'submitting'|'ok'|'backup', payload?, failKey?}

function applyLang() {
  document.documentElement.lang = lang;
  $("lang-en").classList.toggle("on", lang === "en");
  $("lang-ko").classList.toggle("on", lang === "ko");
  // gate
  $("g-title").textContent = t("title");
  $("g-sub").textContent = t("sub");
  $("g-intro").innerHTML = t("intro");
  $("g-guide").innerHTML = t("guide");
  $("btn-help").textContent = t("help");
  $("btn-help-close").textContent = t("helpClose");
  if (!$("help-overlay").classList.contains("hidden")) $("help-guide").innerHTML = t("guide");
  $("g-name-label").textContent = t("nameLabel");
  $("inp-name").placeholder = t("namePh");
  $("g-phone-label").textContent = t("phoneLabel");
  $("btn-start").textContent = t("start");
  if ($("gate-err").textContent) $("gate-err").textContent = t("errName");
  // survey (re-render if active)
  $("prog-word").textContent = t("progWord");
  $("prog-total").textContent = N_ITEMS;
  if (S && !$("survey").classList.contains("hidden")) render();
  // done
  if (doneState) renderDone();
}
function setLang(l) { lang = l; localStorage.setItem("festdpo_lang", l); applyLang(); }
$("lang-en").onclick = () => setLang("en");
$("lang-ko").onclick = () => setLang("ko");

/* ================= seeded rng ================= */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= state ================= */
let S = null;   // { name, nameKey, sessionId, phone, itemOrder, perms, answers, cursor, startedAt }

function storeKey(nameKey) { return STORE_PREFIX + nameKey; }
function save() { localStorage.setItem(storeKey(S.nameKey), JSON.stringify(S)); }

function initState(name) {
  const nameKey = name.trim().toLowerCase().replace(/\s+/g, "");
  const saved = localStorage.getItem(storeKey(nameKey));
  if (saved) {
    try {
      const st = JSON.parse(saved);
      if (st.itemOrder && st.itemOrder.length === ITEMS.length) { S = st; return; }
    } catch (e) { /* corrupt -> reinit */ }
  }
  const rng = mulberry32(xmur3("festdpo|" + nameKey)());
  const itemOrder = shuffled(ITEMS.map((_, i) => i), rng);
  const perms = {};
  for (const it of ITEMS) perms[it.id] = shuffled([0, 1, 2, 3], rng);
  const answers = {};
  for (const it of ITEMS) answers[it.id] = { align: [null,null,null,null], aes: [null,null,null,null] };
  const startedAt = new Date().toISOString();
  S = { name: name.trim(), nameKey, itemOrder, perms, answers, cursor: 0,
        startedAt, sessionId: nameKey + "_" + startedAt + (TEST_N ? "_test" + TEST_N : ""), phone: null };
  save();
}

/* ================= gate ================= */
$("btn-start").onclick = () => {
  const name = $("inp-name").value.trim();
  const phone = $("inp-phone").value.trim();
  if (name.length < 2) { $("gate-err").textContent = t("errName"); return; }
  initState(name);
  if (phone) S.phone = phone;
  save();
  $("gate").classList.add("hidden");
  $("survey").classList.remove("hidden");
  render();
};

/* ================= survey render ================= */
function curItem() { return ITEMS[S.itemOrder[S.cursor]]; }

function itemComplete(it) {
  const a = S.answers[it.id];
  return a.align.every(v => v !== null) && a.aes.every(v => v !== null);
}

function render() {
  const it = curItem();
  const perm = S.perms[it.id];          // display position p shows original image index perm[p]
  $("prog-num").textContent = S.cursor + 1;
  $("prog-fill").style.width = (100 * S.cursor / ITEMS.length) + "%";
  $("who").textContent = t("who", S.name);
  $("scale-hint").textContent = t("scaleHint");
  $("prompt-text").textContent = it.prompt;
  const showKo = lang === "ko" && it.ko;
  $("prompt-ko").textContent = showKo ? "🇰🇷 " + it.ko : "";
  $("prompt-ko").classList.toggle("hidden", !showKo);

  const grid = $("grid");
  grid.innerHTML = "";
  perm.forEach((origIdx, pos) => {
    const img = it.images[origIdx];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      `<div class="imgno">${t("imageN", pos + 1)}</div>` +
      `<img src="${img.src}" loading="eager" alt="${t("imageN", pos + 1)}">` +
      `<div class="rate">` +
        `<div class="rlabel">${t("align")}</div><div class="scale" data-k="align"></div>` +
        `<div class="rlabel">${t("aes")}</div><div class="scale" data-k="aes"></div>` +
      `</div>`;
    card.querySelector("img").onclick = () => {
      $("lightbox-img").src = img.src;
      $("lightbox").classList.remove("hidden");
    };
    for (const scaleEl of card.querySelectorAll(".scale")) {
      const k = scaleEl.dataset.k;
      for (let v = 1; v <= 5; v++) {
        const b = document.createElement("button");
        b.textContent = v;
        if (S.answers[it.id][k][origIdx] === v) b.classList.add("sel");
        b.onclick = () => {
          S.answers[it.id][k][origIdx] = v;
          save();
          for (const x of scaleEl.children) x.classList.remove("sel");
          b.classList.add("sel");
          card.classList.toggle("complete",
            S.answers[it.id].align[origIdx] !== null && S.answers[it.id].aes[origIdx] !== null);
          updateNav();
        };
        scaleEl.appendChild(b);
      }
    }
    if (S.answers[it.id].align[origIdx] !== null && S.answers[it.id].aes[origIdx] !== null)
      card.classList.add("complete");
    grid.appendChild(card);
  });
  updateNav();
  preloadNext();
  window.scrollTo(0, 0);
}

function updateNav() {
  const it = curItem();
  const done = itemComplete(it);
  const last = S.cursor === ITEMS.length - 1;
  $("btn-prev").textContent = t("prev");
  $("btn-prev").disabled = S.cursor === 0;
  $("btn-next").disabled = !done;
  $("btn-next").textContent = last ? t("submit") : t("next");
  $("nav-hint").textContent = done ? "" : t("hint");
}

function preloadNext() {
  if (S.cursor + 1 < ITEMS.length) {
    for (const im of ITEMS[S.itemOrder[S.cursor + 1]].images) {
      const i = new Image(); i.src = im.src;
    }
  }
}

$("btn-prev").onclick = () => { if (S.cursor > 0) { S.cursor--; save(); render(); } };
$("btn-next").onclick = () => {
  if (!itemComplete(curItem())) return;
  if (S.cursor === ITEMS.length - 1) { finish(); return; }
  S.cursor++; save(); render();
};
$("lightbox").onclick = () => $("lightbox").classList.add("hidden");
$("btn-help").onclick = () => {
  $("help-guide").innerHTML = t("guide");
  $("help-overlay").classList.remove("hidden");
};
$("btn-help-close").onclick = () => $("help-overlay").classList.add("hidden");
$("help-overlay").onclick = (e) => {
  if (e.target === $("help-overlay")) $("help-overlay").classList.add("hidden");
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    $("lightbox").classList.add("hidden");
    $("help-overlay").classList.add("hidden");
  }
});

/* ================= submit ================= */
function buildRows() {
  const rows = [];
  const ts = new Date().toISOString();
  for (const it of ITEMS) {
    const perm = S.perms[it.id];
    perm.forEach((origIdx, pos) => {
      const img = it.images[origIdx];
      rows.push([ts, S.name, S.startedAt, it.id, img.k, pos + 1,
                 S.answers[it.id].align[origIdx], S.answers[it.id].aes[origIdx]]);
    });
  }
  return rows;
}

function renderDone() {
  const done = $("done");
  done.classList.remove("hidden");
  if (doneState.kind === "submitting") {
    done.innerHTML = `<div class="spin"></div><h2>${t("submitting")}</h2><p>${t("wait")}</p>`;
  } else if (doneState.kind === "ok") {
    done.innerHTML = `<h2>${t("doneTitle")}</h2>
      <p>${t("doneThanks", S.name)}</p><p>${t("doneClose")}</p>`;
  } else if (doneState.kind === "backup") {
    done.innerHTML = `<h2>${t("backupTitle")}</h2>
      <p>${t(doneState.failKey)}</p>
      <p>${t("backupInstr")}</p>
      <button class="btn btn-primary" id="btn-download" style="margin-top:14px">${t("download")}</button>
      <div style="margin-top:12px"><button class="btn btn-ghost" id="btn-retry">${t("retry")}</button></div>`;
    $("btn-download").onclick = () => {
      const blob = new Blob([JSON.stringify(doneState.payload, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `survey_${S.nameKey}_${Date.now()}.json`;
      a.click();
    };
    $("btn-retry").onclick = finish;
  }
}

async function finish() {
  $("survey").classList.add("hidden");
  doneState = { kind: "submitting" };
  renderDone();
  const payload = { annotator: S.name, sessionId: S.sessionId, phone: S.phone || "",
                    startedAt: S.startedAt, submittedAt: new Date().toISOString(),
                    rows: buildRows() };
  if (!API_URL) { doneState = { kind: "backup", payload, failKey: "failNoServer" }; renderDone(); return; }
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    doneState = { kind: "ok" };
    renderDone();
    localStorage.setItem(storeKey(S.nameKey) + "_submitted", "1");
  } catch (e) {
    doneState = { kind: "backup", payload, failKey: "failNet" };
    renderDone();
  }
}

applyLang();
</script>
</body>
</html>
